name: Dark Med Android Runtime QA

on:
  workflow_dispatch:
    inputs:
      run_network_evidence:
        description: Collect passive device/network metadata only
        required: true
        default: false
        type: boolean
  push:
    paths:
      - "app/**"
      - "tools/**"
      - ".github/workflows/android-runtime-qa.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"

permissions:
  contents: read

concurrency:
  group: darkmed-runtime-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 30, 31, 33, 34]
        arch: [x86_64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Enable KVM and fail closed when unavailable
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          stat -c 'KVM=%n mode=%a' /dev/kvm

      - name: Configure Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run emulator instrumentation and collect evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: ${{ matrix.arch }}
          profile: pixel_7
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          ndk: 27.2.12479018
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p reports/github_actions_runtime
            adb wait-for-device
            adb shell getprop > reports/github_actions_runtime/getprop.txt
            adb shell settings get global airplane_mode_on > reports/github_actions_runtime/airplane_mode_before.txt
            adb logcat -c
            PCAP_MODE=NOT_AVAILABLE
            if adb shell command -v tcpdump >/dev/null 2>&1; then
              adb shell "tcpdump -i any -w /data/local/tmp/darkmed-runtime.pcap -c 500 >/dev/null 2>&1 &" || true
              PCAP_MODE=AVAILABLE
            fi
            echo "tcpdump=$PCAP_MODE" > reports/github_actions_runtime/pcap_status.txt
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace > reports/github_actions_runtime/instrumentation.log 2>&1
            TEST_RC=$?
            cat reports/github_actions_runtime/instrumentation.log
            adb logcat -d > reports/github_actions_runtime/logcat.txt || true
            adb shell dumpsys meminfo com.darkmed.app > reports/github_actions_runtime/meminfo.txt || true
            adb shell dumpsys package com.darkmed.app > reports/github_actions_runtime/package_state.txt || true
            adb shell dumpsys connectivity > reports/github_actions_runtime/connectivity.txt || true
            if [ "$PCAP_MODE" = "AVAILABLE" ]; then
              TCPDUMP_PIDS=$(adb shell pidof tcpdump 2>/dev/null | tr -d '\r' || true)
              if [ -n "$TCPDUMP_PIDS" ]; then adb shell kill $TCPDUMP_PIDS >/dev/null 2>&1 || true; fi
              adb pull /data/local/tmp/darkmed-runtime.pcap reports/github_actions_runtime/traffic.pcap >/dev/null 2>&1 || true
            fi
            adb shell am send-trim-memory com.darkmed.app RUNNING_CRITICAL > reports/github_actions_runtime/trim_memory.txt 2>&1 || true
            adb shell am set-inactive com.darkmed.app true > reports/github_actions_runtime/set_inactive.txt 2>&1 || true
            adb shell dumpsys deviceidle force-idle > reports/github_actions_runtime/force_idle.txt 2>&1 || true
            if [ "$TEST_RC" -ne 0 ]; then
              adb exec-out screencap -p > reports/github_actions_runtime/failure.png || true
              adb bugreport reports/github_actions_runtime/bugreport.zip || true
            fi
            exit "$TEST_RC"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkmed-runtime-qa-api-${{ matrix.api-level }}-${{ matrix.arch }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            reports/github_actions_runtime/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/connected_android_test_additional_output/**
            app/build/reports/androidTests/**
